name: Android APK

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/vectorcraft-web/**"
      - "crates/**"
      - "packaging/android/**"
      - "assets/app-icon/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/vectorcraft-web/**"
      - "crates/**"
      - "packaging/android/**"
      - "assets/app-icon/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build the offline web app
        working-directory: apps/vectorcraft-web
        run: trunk build --release

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.13"

      - name: Build installable debug APK
        run: gradle --no-daemon --project-dir packaging/android assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vectorcraft-android-apk
          path: packaging/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
