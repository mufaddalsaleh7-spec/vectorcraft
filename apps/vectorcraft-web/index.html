<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VectorCraft">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#262626">
  <title>VectorCraft</title>
  <link data-trunk rel="rust" data-bin="vectorcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    /* The browser page never scrolls or zooms: the real editor canvas owns those gestures.  Fixed
       dynamic-viewport sizing follows iOS/Android browser chrome and orientation changes. */
    html, body {
      position: fixed; inset: 0; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #262626; overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    }
    @supports (height: 100dvh) {
      html, body { width: 100dvw; height: 100dvh; }
    }
    /* Inside the safe areas (notch, home indicator) of a full-screen app. */
    #vectorcraft_canvas {
      position: fixed;
      top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; touch-action: none;
    }
    #vectorcraft_loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none;
    }
    /* Recommendation only: portrait still runs the same editor and rotation hides this note. */
    #vectorcraft_orientation {
      display: none; position: fixed; z-index: 10; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      translate: -50% 0; max-width: calc(100% - 32px); box-sizing: border-box; padding: 7px 12px;
      border: 1px solid #5b5b5b; border-radius: 7px; background: rgba(38, 38, 38, .94); color: #e2e2e2;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .35); font: 12px/1.3 system-ui, sans-serif; text-align: center;
      white-space: nowrap; pointer-events: none;
    }
    @media (orientation: portrait) and (max-width: 600px) {
      #vectorcraft_orientation { display: block; }
    }
  </style>
</head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>
  <div id="vectorcraft_loading">Loading VectorCraft&hellip;</div>
  <aside id="vectorcraft_orientation" role="status" aria-live="polite">For the full desktop workspace, rotate your phone to landscape.</aside>
</body>
</html>
